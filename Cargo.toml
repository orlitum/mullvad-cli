[package]
name = "mullvad-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Mullvad Multi-Account CLI, Slot-Eviction Watchdog & TUI"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
libc = "0.2"
ratatui = "0.29"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.41", features = ["full"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
